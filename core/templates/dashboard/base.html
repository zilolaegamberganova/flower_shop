<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding-top: 20px;
        }
        .sidebar .brand {
            font-size: 20px;
            font-weight: 700;
            color: #d63384;
            padding: 0 25px 20px 25px;
            border-bottom: 1px solid #f0f0f0;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 25px;
            color: #555;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #fff0f6;
            color: #d63384;
            border-left: 4px solid #d63384;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            background: #fff;
            padding: 25px;
        }
        .table-custom th {
            background-color: #fafafa;
            color: #666;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand"><i class="fa-solid fa-flower"></i> Flower Admin</div>
        <a href="{% url 'main_dashboard' %}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="{% url 'category_list' %}"><i class="fa-solid fa-list"></i> Kategoriyalar</a>
        <a href="{% url 'product_list' %}"><i class="fa-solid fa-box"></i> Mahsulotlar</a>
        <a href="{% url 'user_list' %}"><i class="fa-solid fa-users"></i> Mijozlar</a>
        <a href="{% url 'order_list' %}"><i class="fa-solid fa-cart-shopping"></i> Buyurtmalar</a>
        <a href="{% url 'logout_page' %}" class="text-danger mt-4"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</a>
    </div>

    <div class="main-content">
        <div class="card-custom">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- OK tugmasiz chiroyli Toast bildirishnoma funksiyasi -->
    <script>
    function showNotification(msg) {
        let box = document.createElement("div");
        box.innerText = "🌸 " + msg;
        box.style.cssText = "position: fixed; bottom: 25px; right: 25px; background: #28a745; color: #fff; padding: 12px 24px; border-radius: 10px; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.15); font-weight: 600; transition: opacity 0.5s ease;";
        document.body.appendChild(box);

        setTimeout(() => {
            box.style.opacity = "0";
            setTimeout(() => box.remove(), 500);
        }, 2500);
    }
    </script>

    {% block javascript %}{% endblock %}
</body>
</html>
