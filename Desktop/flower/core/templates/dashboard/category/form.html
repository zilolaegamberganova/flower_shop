{% extends 'dashboard/base.html' %}
{% block content %}
<div class="admin-page-head"><div><h2>🌷 {% if model.pk %}Kategoriyani tahrirlash{% else %}Yangi kategoriya{% endif %}</h2></div><a href="{% url 'category_list' %}" class="btn btn-light">← Orqaga</a></div>
<div class="admin-card form-card"><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Kategoriya nomi</label>{{ form.title }}{% if form.title.errors %}<div class="text-danger">{{ form.title.errors }}</div>{% endif %}<button class="btn btn-flower mt-4" type="submit">Saqlash</button></form></div>
{% endblock %}
